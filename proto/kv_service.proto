syntax = "proto3";

package minidb;

option java_multiple_files = true;
option java_package = "com.minidb.proto";
option java_outer_classname = "KvServiceProto";

// Key-Value Service API
service KvService {
  // Store a key-value pair
  rpc Put(PutRequest) returns (PutResponse);
  // Retrieve a value by key
  rpc Get(GetRequest) returns (GetResponse);
  // Consistent (linearizable) read
  rpc ConsistentGet(GetRequest) returns (GetResponse);
  // Delete a key (tombstone)
  rpc Delete(DeleteRequest) returns (DeleteResponse);
  // Range scan
  rpc Scan(ScanRequest) returns (ScanResponse);

  // ---- Speculative MVCC Consensus (Novel) ----
  // Speculative put: writes immediately, returns before consensus
  rpc SpeculativePut(SpeculativePutRequest) returns (SpeculativePutResponse);
  // Speculative delete: writes tombstone immediately, returns before consensus
  rpc SpeculativeDelete(SpeculativeDeleteRequest) returns (SpeculativePutResponse);

  // ---- Chronos Time-Travel & Audit ----
  rpc GetAsOfVersion(TemporalKeyRequest) returns (TemporalKeyResponse);
  rpc GetAsOfTime(TemporalKeyRequest) returns (TemporalKeyResponse);
  rpc ReconstructState(ReconstructStateRequest) returns (ReconstructStateResponse);
  rpc GetAuditHistory(AuditHistoryRequest) returns (AuditHistoryResponse);
}

message PutRequest {
  string key = 1;
  bytes value = 2;
  string txn_id = 3; // optional, for 2PC transactions
}

message PutResponse {
  bool success = 1;
  string error = 2;
  int64 timestamp = 3;
}

message GetRequest {
  string key = 1;
  int64 timestamp = 2; // 0 means latest
}

message GetResponse {
  bool found = 1;
  bytes value = 2;
  int64 timestamp = 3;
  string error = 4;
}

message DeleteRequest {
  string key = 1;
  string txn_id = 2;
}

message DeleteResponse {
  bool success = 1;
  string error = 2;
}

message ScanRequest {
  string start_key = 1;
  string end_key = 2;
  int32 limit = 3;
  int64 timestamp = 4; // 0 means latest
}

message ScanResponse {
  repeated KvPair pairs = 1;
  string error = 2;
}

message KvPair {
  string key = 1;
  bytes value = 2;
  int64 timestamp = 3;
}

// ---- Speculative MVCC Consensus Messages ----

message SpeculativePutRequest {
  string key = 1;
  bytes value = 2;
}

message SpeculativeDeleteRequest {
  string key = 1;
}

message SpeculativePutResponse {
  bool success = 1;
  bool speculative = 2;        // true if write is speculative (not yet committed)
  int64 timestamp = 3;          // MVCC timestamp of the speculative version
  int64 raft_log_index = 4;     // Raft log index for commit tracking
  double write_latency_ms = 5;  // Local write latency in milliseconds
  string error = 6;
}

// ---- Chronos Time-Travel & Audit Messages ----

message TemporalKeyRequest {
  string key = 1;
  string version_id = 2;
  string timestamp = 3;
  string snapshot_id = 4;
  string branch_id = 5;
  bool consistent = 6;
}

message TemporalKeyResponse {
  bool found = 1;
  bytes value = 2;
  bool tombstone = 3;
  bool speculative = 4;
  string version_id = 5;
  int64 version_sequence = 6;
  int64 timestamp = 7;
  string branch_id = 8;
  string writer_id = 9;
  string error = 10;
  string error_code = 11;
}

message ReconstructStateRequest {
  string mode = 1; // CURRENT, AS_OF_VERSION, AS_OF_TIME, AS_OF_SNAPSHOT
  string version_id = 2;
  string timestamp = 3;
  string snapshot_id = 4;
  string branch_id = 5;
  string prefix = 6;
  int32 limit = 7;
  bool consistent = 8;
}

message ReconstructStateResponse {
  string version_id = 1;
  int64 version_sequence = 2;
  int64 timestamp = 3;
  string branch_id = 4;
  repeated KvPair pairs = 5;
  string error = 6;
  string error_code = 7;
}

message AuditHistoryRequest {
  string key = 1;
  bool include_uncommitted = 2;
}

message AuditEntryProto {
  string version_id = 1;
  int64 version_sequence = 2;
  int64 timestamp = 3;
  string branch_id = 4;
  string status = 5;
  string operation_type = 6;
  string old_value = 7;
  string new_value = 8;
  string writer_id = 9;
  string transaction_id = 10;
}

message AuditHistoryResponse {
  string key = 1;
  repeated AuditEntryProto entries = 2;
  string error = 3;
}
