apiVersion: v1
kind: Namespace
metadata:
  name: chronos
---
# Headless Service for StatefulSet DNS
apiVersion: v1
kind: Service
metadata:
  name: chronos-headless
  namespace: chronos
  labels:
    app: chronos
spec:
  clusterIP: None
  selector:
    app: chronos
  ports:
    - name: http
      port: 8080
      targetPort: 8080
    - name: grpc
      port: 9090
      targetPort: 9090
---
# Client-facing Service (load-balanced)
apiVersion: v1
kind: Service
metadata:
  name: chronos-client
  namespace: chronos
  labels:
    app: chronos
spec:
  type: ClusterIP
  selector:
    app: chronos
  ports:
    - name: http
      port: 8080
      targetPort: 8080
    - name: grpc
      port: 9090
      targetPort: 9090
